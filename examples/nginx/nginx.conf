events {}
http {
  upstream application { server 127.0.0.1:8080; }
  server {
    listen 8081;
    location = /_aux_sidecar_check {
      internal;
      proxy_pass http://unix:/var/run/aux-sidecar/sidecar.sock:/sidecar/proxy/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header DPoP $http_dpop;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-Client-IP $remote_addr;
      proxy_set_header X-Proxy-Adapter nginx;
    }
    location / {
      auth_request /_aux_sidecar_check;
      auth_request_set $auth_challenge $upstream_http_www_authenticate;
      auth_request_set $aux_proxy_status $upstream_http_x_aux_proxy_status;
      auth_request_set $aux_retry_after $upstream_http_retry_after;
      add_header WWW-Authenticate $auth_challenge always;
      error_page 403 = @aux_denied;
      proxy_pass http://application;
    }
    location @aux_denied {
      add_header Retry-After $aux_retry_after always;
      if ($aux_proxy_status = 429) { return 429; }
      return 403;
    }
  }
}
