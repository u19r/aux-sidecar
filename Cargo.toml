# Versions: software-versions.json; details in software-version-consumers.md.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
rust-version = "1.99.1"
documentation = "https://docs.rs/aux-sidecar"
edition = "2024"
homepage = "https://github.com/u19r/aux-sidecar"
license = "MIT OR Apache-2.0"
repository = "https://github.com/u19r/aux-sidecar"
version = "0.1.0"

[workspace.dependencies]
alloc-counter = { git = "https://github.com/u19r/aux-common", package = "alloc-counter", rev = "13a283d32223ed27a37e9cf17f22ac16d26ca8a9" }
authz-cedar = { git = "https://github.com/u19r/aux-common", package = "authz-cedar", rev = "13a283d32223ed27a37e9cf17f22ac16d26ca8a9" }
authz-runtime = { git = "https://github.com/u19r/aux-common", package = "authz-runtime", rev = "13a283d32223ed27a37e9cf17f22ac16d26ca8a9" }
authz-types = { git = "https://github.com/u19r/aux-common", package = "authz-types", rev = "13a283d32223ed27a37e9cf17f22ac16d26ca8a9" }
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
cpu-time = "1.0.0"
cucumber = "0.23.0"
futures = "0.3.34"
http = "1.5.0"
http-request = { git = "https://github.com/u19r/aux-common", package = "http-request", rev = "13a283d32223ed27a37e9cf17f22ac16d26ca8a9" }
js-sys = "0.3.107"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem"] }
jwt-decode = { git = "https://github.com/u19r/aux-common", package = "jwt-decode", rev = "13a283d32223ed27a37e9cf17f22ac16d26ca8a9" }
libc = "0.2.191"
oauth-dpop = { git = "https://github.com/u19r/aux-common", package = "oauth-dpop", rev = "13a283d32223ed27a37e9cf17f22ac16d26ca8a9" }
proptest = "1.12.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full", "tracing"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
implicit_hasher = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
string_slice = "deny"

[workspace.lints.rust]
dead_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
unused_imports = "warn"
unused_must_use = "warn"
unused_variables = "warn"

[profile.release]
opt-level = "z"
codegen-units = 1
overflow-checks = true
panic = "unwind"
lto = "fat"
strip = "symbols"

[profile.fast-release]
inherits = "release"
opt-level = 1
codegen-units = 256
lto = false

[profile.dev]
lto = false
debug-assertions = true
opt-level = 0
strip = "none"
debug = 0
incremental = false
codegen-units = 256
