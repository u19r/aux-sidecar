[advisories]
version = 2
ignore = [
  # jsonwebtoken currently depends on rsa for algorithm support. Sidecar fixture signing uses HS256
  # and production validation does not perform private-key RSA operations.
  "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/u19r/aux-common",
]
